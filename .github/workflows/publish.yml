name: Publish Compose Navigation Adapters (Maven Central)

# Publish after com.taqlyn:taqlyn-sdk is on Maven Central.
# Order inside this repo: model → navigation2 → navigation3.

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-nav-compose-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish Compose Nav
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Run tests
        run: ./gradlew test
      - name: Publish model, then navigation2, then navigation3
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY is required for Maven Central."
            exit 1
          fi
          export ORG_GRADLE_PROJECT_signingInMemoryKey="$(printf '%s' "$GPG_PRIVATE_KEY" | base64 -d)"
          publish_mod() {
            ./gradlew "$1"
          }
          publish_mod :model:publishAndReleaseToMavenCentral
          publish_mod :navigation2:publishAndReleaseToMavenCentral
          publish_mod :navigation3:publishAndReleaseToMavenCentral

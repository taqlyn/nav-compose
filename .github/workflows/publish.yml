name: Publish Compose Navigation Adapters (Maven Central)

# Publish after com.taqlyn:taqlyn-sdk is on Maven Central.
# Order inside this repo: model → navigation2 → navigation3.

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-nav-compose-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish Compose Nav
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Run tests
        run: ./gradlew test
      - name: Publish model, then navigation2, then navigation3
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY is required for Maven Central."
            exit 1
          fi
          GPG_PASSPHRASE="$(printf '%s' "$GPG_PASSPHRASE" | tr -d '\r')"
          key_file="${RUNNER_TEMP}/signing-key.asc"
          if printf '%s' "$GPG_PRIVATE_KEY" | grep -q "BEGIN PGP"; then
            printf '%s\n' "$GPG_PRIVATE_KEY" > "$key_file"
          else
            printf '%s' "$GPG_PRIVATE_KEY" | base64 -d > "$key_file"
          fi
          if [ ! -s "$key_file" ]; then
            echo "::error::Failed to decode GPG_PRIVATE_KEY into an ASCII-armored PGP key."
            exit 1
          fi
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf 'pinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          gpg --batch --import --no-tty --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" "$key_file"
          key_id="${GPG_KEY_ID#0x}"
          key_id="${key_id#0X}"
          if [ "${#key_id}" -ge 8 ]; then
            key_id="${key_id: -8}"
          fi
          ./gradlew -I gradle/ci-gpg.init.gradle \
            -Psigning.gnupg.keyName="$key_id" \
            -Psigning.gnupg.passphrase="$GPG_PASSPHRASE" \
            :model:publishAndReleaseToMavenCentral --stacktrace
          ./gradlew -I gradle/ci-gpg.init.gradle \
            -Psigning.gnupg.keyName="$key_id" \
            -Psigning.gnupg.passphrase="$GPG_PASSPHRASE" \
            :navigation2:publishAndReleaseToMavenCentral --stacktrace
          ./gradlew -I gradle/ci-gpg.init.gradle \
            -Psigning.gnupg.keyName="$key_id" \
            -Psigning.gnupg.passphrase="$GPG_PASSPHRASE" \
            :navigation3:publishAndReleaseToMavenCentral --stacktrace
